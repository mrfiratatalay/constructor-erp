# Arayüz sayfalarının güvenlik başlıkları (nginx.conf'taki her sayfa location'ı bunu içerir: add_header yazılan
# location üst bloğun başlıklarını devralmaz). /api'nin başlıklarını backend (Spring Security) yazar.
#
# CSP: betik yalnızca kendi sunucumuzdan; satır içi betik, eval ve başka sitenin betiği çalışmaz. Arayüz dışarıdan hiçbir
# şey yüklemez. Stil satır içi olabilir (Vant ve Element Plus bileşenleri style özniteliği yazar); önizlemeler blob:,
# ikon fontu data: adresinden gelir; fotoğraf küçültme işçisi blob: adresinden açılır. Vant'ın ikon fontunda ikinci
# kaynak olarak bir CDN adresi (at.alicdn.com) de yazar: Safari onu reddettiğini konsola yazar ama fontu gömülü woff2'den
# yükler. Bu uyarı için CDN'e izin verilmez: telefonlar böylece üçüncü bir tarafa hiç istek atmaz.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Başka bir site uygulamayı çerçeve içinde açıp tıklamaları kendi düğmelerinin altına gizleyemez (CSP'yi bilmeyen
# tarayıcılar için de).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Adreslerde tek kullanımlık giriş, kurulum ve katılma anahtarları durur (/davet/…, /kurulum/…, /katil/…): başka bir
# siteye giden bağlantıda adres Referer ile gitmez.
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
