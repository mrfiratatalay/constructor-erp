# Arayüzü sunar ve /api'yi backend'e geçirir: ikisi aynı adreste görünür (oturum çerezi SameSite=Strict).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Hata sayfaları ve Server başlığı nginx'in sürümünü söylemez: bilinen açığı olan sürüm aranırken ipucu vermeyiz.
    server_tokens off;

    # Sahadan 200 MB'a kadar video gelebilir (application.yml ile aynı sınır).
    client_max_body_size 250m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx dışarıyla ilk temas noktasıdır: istemcinin kendi yazdığı X-Forwarded-For atılır, bağlantının gerçek adresi
        # yazılır. Eklenseydi iç ağdan gelen biri (Tomcat iç ağ adreslerini vekil sayar) uydurduğu adresle giriş
        # denemesi sınırını aşabilirdi. Önüne bir yük dengeleyici konursa güvenilen adresi real_ip ile verilir.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Büyük yüklemeler diske yazılıp beklemeden doğrudan akar; işlenmesi de uzun sürebilir.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Service worker her açılışta yenilenmeli, yoksa eski sürüm telefonda takılı kalır.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Dosya adlarında özet (hash) var: bir kez indirilir, bir daha sorulmaz.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Tek sayfalık uygulama: bilinmeyen adresler index.html'e düşer, yönlendirmeyi Vue Router yapar.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
