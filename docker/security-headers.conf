# Arayüz sayfalarının güvenlik başlıkları; API cevaplarınınkini Spring Security yazar (iki kez yazılmasın diye /api'de yok).
# nginx'te bir location kendi add_header'ını yazınca üst seviyedekiler gelmez: bu dosya her location'a ayrı eklenir.
# X-Frame-Options: uygulama başka bir sitenin çerçevesinde açılıp kullanıcıya fark ettirmeden tıklatılamaz.
# Referrer-Policy: /davet, /katil, /kurulum adresleri anahtar taşır; dışarı giden bağlantılara adres gönderilmez.
# Permissions-Policy: sesli not mikrofonu kullanır; kamera fotoğraf için açık, konum hiç istenmez.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
